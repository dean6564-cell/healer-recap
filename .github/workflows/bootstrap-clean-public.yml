name: Build clean public snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-clean-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out clean repository
        uses: actions/checkout@v4

      - name: Fetch current public site snapshot
        run: git clone --depth 1 https://github.com/dean6564-cell/healer-recap.git /tmp/healer-recap-source

      - name: Copy only public website material
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/healer-recap-source

          # Keep this repository's .git metadata while rebuilding its working tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          cp "$SRC"/*.html .
          cp "$SRC"/*.css .
          cp "$SRC"/*.js .
          cp "$SRC/.nojekyll" .
          cp -R "$SRC/assets" ./assets
          mkdir -p data
          cp "$SRC/data/guild.json" data/guild.json
          cp "$SRC/data/runs.json" data/runs.json
          cp "$SRC/data/refresh-service.json" data/refresh-service.json

          # Internal review/process material is deliberately NOT copied:
          # REVIEWING.md, AGENTS.md, README-REVIEWED.txt, START-CLEAN.txt,
          # reviewed-run-template.json, evidence/, scripts/, and inspection workflows.

          # Remove private-evidence pointers from the public run payload while
          # preserving the finished review content required by the website.
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/runs.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def scrub(value):
              if isinstance(value, dict):
                  value.pop('evidencePath', None)
                  for child in value.values():
                      scrub(child)
              elif isinstance(value, list):
                  for child in value:
                      scrub(child)

          scrub(data)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # Healer Recap

          Public website for WoW Mythic+ run reviews and guild information.

          This repository contains only the browser-facing website, assets and published report data. Internal combat-log analysis, review methodology and private evidence are maintained separately and are not part of this public source repository.
          EOF

          cat > review-guide.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run reviews · M+ Recap</title><link rel="stylesheet" href="styles.css?v=murder-review-1"><link rel="icon" type="image/svg+xml" href="assets/horde-emblem.svg"></head><body><div id="siteNav"></div><main><div class="wrap narrow"><div class="eyebrow">RUN REVIEWS</div><h1>Understanding your run reviews</h1><p>Explore boss healing, damage timelines, preventability and source-backed tactics in each published run report.</p><a class="button" href="library.html">Browse run reviews</a></div></main><script src="seed-data.js"></script><script src="app.js?v=murder-review-1"></script><script>nav();</script></body></html>
          EOF

          # This bootstrap workflow is temporary; remove it from the clean snapshot.
          rm -rf .github

      - name: Commit clean public snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create clean public website snapshot"
          git push origin HEAD:main
