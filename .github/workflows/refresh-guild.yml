name: Refresh guild data
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: guild-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch guild and character records
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python scripts/refresh-guild.py
      - name: Save snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guild.json
          git diff --cached --quiet || git commit -m "Refresh public guild Mythic+ snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Prepare public website
        run: |
          mkdir -p _site
          cp *.html *.css *.js _site/
          cp -r data _site/data
          if [ -d assets ]; then cp -r assets _site/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4

